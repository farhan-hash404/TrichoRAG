name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:warnings
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  frontend:
    name: Website type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  api-image:
    name: API image builds and serves
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (bakes the evidence index and models)
        run: docker build -t hairgpt-api backend
      - name: Start it the way the host will
        run: |
          docker run -d --name api -p 7860:7860 \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" hairgpt-api
      - name: Smoke test
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:7860/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:7860/health | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h['status'] == 'ok' and h['evidence']['chunks'] > 1000 and h['demo_mode'], h
          print('health ok:', h['evidence'])"
          TOKEN=$(curl -sf -X POST http://localhost:7860/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"demo@example.com","password":"demopassword123"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          SCANS=$(curl -sf http://localhost:7860/api/v1/scans -H "Authorization: Bearer $TOKEN" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          test "$SCANS" -ge 3 && echo "demo record seeded: $SCANS scans"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:7860/api/v1/account -H "Authorization: Bearer $TOKEN")
          test "$CODE" = "403" && echo "shared demo account is protected"
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -n 40
